<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <title>OG Image Template</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .card {
      width: 1200px;
      height: 630px;
      background: #1c1917;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 100px;
      position: relative;
    }

    /* Orange accent bar — top edge */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: #fb923c;
    }

    .name {
      font-family: 'DM Serif Display', serif;
      font-size: 80px;
      font-weight: 400;
      color: #e7e5e4;
      line-height: 1.1;
      margin-bottom: 12px;
      position: relative;
      display: inline-block;
    }

    /* Orange underline under the name */
    .name::after {
      content: "";
      display: block;
      width: 80px;
      height: 4px;
      border-radius: 2px;
      background: #fb923c;
      margin-top: 14px;
    }

    .tagline {
      font-size: 28px;
      font-weight: 400;
      color: #a8a29e;
      margin-top: 28px;
      letter-spacing: 0.01em;
    }

    .url {
      position: absolute;
      bottom: 48px;
      right: 100px;
      font-size: 22px;
      color: #57534e;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="name">Ryan Lynch</h1>
    <p class="tagline">Systematic thinker. Pragmatic builder. Optimistic explorer.</p>
    <span class="url">ryanlynch.me</span>
  </div>
</body>
</html>
